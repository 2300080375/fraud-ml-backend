# Local full backend stack: docker compose up --build
services:
  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: [mongo_data:/data/db]
  backend:
    build: .
    ports: ["5000:5000"]
    environment:
      MONGO_URI: mongodb://mongo:27017
    depends_on: [mongo]
volumes:
  mongo_data:
